<svg width="1000" height="760" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="Diagrama de tres planos. Arriba, los canales: el asegurado entra por una landing personalizada y WhatsApp; la aseguradora observa e interviene desde el dashboard. En el centro, la plataforma Insurmind con cuatro módulos: captación, conversación, cobranza y control. Debajo, una capa de integración con un conector por aseguradora. Abajo, varias aseguradoras con su tarificación, emisión y pagos." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#101917"/></marker>
          <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0A6B58"/></marker>
        </defs>

        <!-- PLANO 1: CANALES -->
        <text x="40" y="34" font-weight="500" font-size="12" letter-spacing="1.6" fill="#5B6E68">CANALES · EL ASEGURADO ENTRA, LA ASEGURADORA OBSERVA</text>

        <rect x="110" y="52" width="270" height="62" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="245" y="82" text-anchor="middle" font-size="15" fill="#101917">Landing personalizada</text>
        <text x="245" y="100" text-anchor="middle" font-size="11.5" fill="#5B6E68">por marca, por broker, por campaña</text>

        <rect x="410" y="52" width="200" height="62" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="510" y="82" text-anchor="middle" font-size="15" fill="#101917">WhatsApp</text>
        <text x="510" y="100" text-anchor="middle" font-size="11.5" fill="#5B6E68">hasta la emisión y el cobro</text>

        <rect x="660" y="52" width="250" height="62" rx="8" fill="none" stroke="#0A6B58" stroke-width="1.6"/>
        <text x="785" y="82" text-anchor="middle" font-size="15" fill="#0A6B58">Dashboard</text>
        <text x="785" y="100" text-anchor="middle" font-size="11.5" fill="#5B6E68">la aseguradora mide y toma el control</text>

        <line x1="245" y1="114" x2="245" y2="204" stroke="#101917" stroke-width="1.3" marker-end="url(#ah)"/>
        <text x="257" y="164" font-size="12" fill="#5B6E68">cotiza</text>
        <line x1="510" y1="114" x2="510" y2="204" stroke="#101917" stroke-width="1.3" marker-end="url(#ah)"/>
        <text x="522" y="164" font-size="12" fill="#5B6E68">conversa</text>
        <line x1="785" y1="118" x2="785" y2="200" stroke="#0A6B58" stroke-width="1.5" marker-start="url(#ahA)" marker-end="url(#ahA)"/>
        <text x="797" y="164" font-size="12" fill="#0A6B58">mide · interviene</text>

        <!-- PLANO 2: INSURMIND -->
        <rect x="60" y="208" width="880" height="222" rx="12" fill="#E3F0EB" stroke="#0A6B58" stroke-width="1.8"/>
        <text x="84" y="248" font-size="23" font-weight="700" fill="#0A6B58" letter-spacing="-0.3">insurmind</text>
        <text x="84" y="272" font-size="13" fill="#5B6E68">Cotiza, resuelve, emite y cobra, sin intervención.</text>

        <rect x="78" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="176" y="320" text-anchor="middle" font-weight="500" font-size="12.5" letter-spacing="1.2" fill="#101917">CAPTACIÓN</text>
        <text x="176" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Landings propias</text>
        <text x="176" y="362" text-anchor="middle" font-size="11.5" fill="#5B6E68">y posicionadas</text>

        <rect x="294" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="392" y="320" text-anchor="middle" font-weight="500" font-size="12.5" letter-spacing="1.2" fill="#101917">CONVERSACIÓN</text>
        <text x="392" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Dudas, recotización,</text>
        <text x="392" y="362" text-anchor="middle" font-size="11.5" fill="#5B6E68">descuentos, emisión</text>

        <rect x="510" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="608" y="320" text-anchor="middle" font-weight="500" font-size="12.5" letter-spacing="1.2" fill="#101917">COBRANZA</text>
        <text x="608" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Recibo por vencer</text>
        <text x="608" y="362" text-anchor="middle" font-size="11.5" fill="#5B6E68">y liga de pago</text>

        <rect x="726" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="824" y="320" text-anchor="middle" font-weight="500" font-size="12.5" letter-spacing="1.2" fill="#101917">CONTROL</text>
        <text x="824" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Conversión y embudo</text>
        <text x="824" y="365" text-anchor="middle" font-size="11.5" fill="#0A6B58">↑ una persona puede entrar</text>

        <!-- CAPA DE INTEGRACIÓN -->
        <line x1="420" y1="430" x2="420" y2="464" stroke="#0A6B58" stroke-width="1.6" marker-end="url(#ahA)"/>
        <line x1="580" y1="464" x2="580" y2="430" stroke="#101917" stroke-width="1.3" marker-end="url(#ah)"/>
        <rect x="60" y="466" width="880" height="46" rx="8" fill="#FFFFFF" stroke="#0A6B58" stroke-width="1.4" stroke-dasharray="6 4"/>
        <text x="84" y="494" font-weight="500" font-size="12" letter-spacing="1.4" fill="#0A6B58">CAPA DE INTEGRACIÓN</text>
        <text x="270" y="494" font-size="12" fill="#5B6E68">un conector por aseguradora · tarificación · emisión · pagos · recibos</text>
        <text x="916" y="494" text-anchor="end" font-size="12" fill="#5B6E68">APIs</text>
        <line x1="420" y1="512" x2="420" y2="576" stroke="#0A6B58" stroke-width="1.6" marker-end="url(#ahA)"/>
        <text x="408" y="548" text-anchor="end" font-size="12" fill="#5B6E68">consulta y ejecuta</text>
        <line x1="580" y1="576" x2="580" y2="512" stroke="#101917" stroke-width="1.3" marker-end="url(#ah)"/>
        <text x="592" y="548" font-size="12" fill="#5B6E68">precios, pólizas y recibos</text>

        <!-- PLANO 3 -->
        <text x="40" y="566" font-weight="500" font-size="12" letter-spacing="1.6" fill="#5B6E68">LAS ASEGURADORAS · UNA O VARIAS A LA VEZ</text>
        <rect x="109" y="580" width="210" height="112" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="214" y="608" text-anchor="middle" font-weight="500" font-size="12" letter-spacing="1.2" fill="#101917">ASEGURADORA</text>
        <text x="214" y="633" text-anchor="middle" font-size="11.5" fill="#5B6E68">tarificación</text>
        <text x="214" y="652" text-anchor="middle" font-size="11.5" fill="#5B6E68">emisión</text>
        <text x="214" y="671" text-anchor="middle" font-size="11.5" fill="#5B6E68">pagos</text>
        <rect x="343" y="580" width="210" height="112" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="448" y="608" text-anchor="middle" font-weight="500" font-size="12" letter-spacing="1.2" fill="#101917">ASEGURADORA</text>
        <text x="448" y="633" text-anchor="middle" font-size="11.5" fill="#5B6E68">tarificación</text>
        <text x="448" y="652" text-anchor="middle" font-size="11.5" fill="#5B6E68">emisión</text>
        <text x="448" y="671" text-anchor="middle" font-size="11.5" fill="#5B6E68">pagos</text>
        <rect x="577" y="580" width="210" height="112" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="682" y="608" text-anchor="middle" font-weight="500" font-size="12" letter-spacing="1.2" fill="#101917">ASEGURADORA</text>
        <text x="682" y="633" text-anchor="middle" font-size="11.5" fill="#5B6E68">tarificación</text>
        <text x="682" y="652" text-anchor="middle" font-size="11.5" fill="#5B6E68">emisión</text>
        <text x="682" y="671" text-anchor="middle" font-size="11.5" fill="#5B6E68">pagos</text>
        <rect x="811" y="580" width="80" height="112" rx="8" fill="none" stroke="#0A6B58" stroke-width="1.4" stroke-dasharray="5 4"/>
        <text x="851" y="642" text-anchor="middle" font-size="20" fill="#0A6B58">+ N</text>

        <text x="40" y="728" font-size="12" fill="#5B6E68">El core —póliza de registro, siniestros, contabilidad técnica— vive en este plano. No es nuestro.</text>
      </svg>